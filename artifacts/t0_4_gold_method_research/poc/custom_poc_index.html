<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Annotation POC</title>
<style>
 body{font:14px system-ui,sans-serif;margin:0;background:#f4f4f4;color:#111}
 #bar{position:sticky;top:0;background:#fff;border-bottom:1px solid #ccc;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 #wrap{position:relative;display:inline-block;margin:12px}
 #page{display:block;border:1px solid #999;background:#fff;max-width:100%}
 #ov{position:absolute;left:0;top:0;width:100%;height:100%;cursor:crosshair}
 .box{position:absolute;border:2px solid #d33;background:rgba(220,50,50,.12)}
 .badge{background:#fee;color:#900;padding:2px 6px;border-radius:4px;font-weight:600}
 button,input,select{font:inherit}
</style></head><body>
<div id="bar">
 <span class="badge">TOOLING_POC_ONLY – not Gold</span>
 <label>Annotator <input id="ann" size="5" value="A01"></label>
 <label>Doc <select id="doc"></select></label>
 <button id="prev">◀</button>
 <label>Page (1-based) <input id="pg" type="number" min="1" value="1" style="width:5em"></label>
 <span id="of"></span>
 <button id="next">▶</button>
 <button id="ms">Mark start</button><button id="me">Mark end</button>
 <button id="save">Save region</button>
 <span id="msg"></span>
</div>
<div id="wrap"><img id="page" alt="page"><div id="ov"></div></div>
<script>
const $=s=>document.querySelector(s);
let docs=[],cur=0,n=0,drag=null,box=null;
async function init(){
  docs=await (await fetch('/api/docs')).json();
  $('#doc').innerHTML=docs.map(d=>`<option value="${d.doc}">${d.doc} (${d.n_pages} pp)</option>`).join('');
  $('#doc').onchange=()=>{cur=0;go(0)};
  go(0);
}
function go(i){
  const d=docs.find(x=>x.doc==$('#doc').value); n=d.n_pages;
  cur=Math.max(0,Math.min(n-1,i)); $('#pg').value=cur+1; $('#of').textContent='of '+n;
  box=null; $('#ov').innerHTML='';
  const t0=performance.now(); const im=$('#page');
  im.onload=()=>{window.__lastLoadMs=performance.now()-t0; window.__loaded=cur;};
  im.src=`/api/page/${d.doc}/${cur}.png?dpi=110`;      // LAZY: only the visible page is fetched
}
$('#prev').onclick=()=>go(cur-1); $('#next').onclick=()=>go(cur+1);
$('#pg').onchange=()=>go(parseInt($('#pg').value)-1);
async function post(payload){
  const r=await fetch('/api/annotate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({annotator:$('#ann').value,doc:$('#doc').value,payload})});
  $('#msg').textContent=r.ok?'saved':'error '+r.status; return r.ok;
}
$('#ms').onclick=()=>post({kind:'span_start_POC',page_index0:cur});
$('#me').onclick=()=>post({kind:'span_end_POC',page_index0:cur});
$('#ov').onmousedown=e=>{const r=$('#ov').getBoundingClientRect();drag=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];};
$('#ov').onmousemove=e=>{if(!drag)return;const r=$('#ov').getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  box=[Math.min(drag[0],x),Math.min(drag[1],y),Math.max(drag[0],x),Math.max(drag[1],y)];
  $('#ov').innerHTML=`<div class="box" style="left:${box[0]*100}%;top:${box[1]*100}%;width:${(box[2]-box[0])*100}%;height:${(box[3]-box[1])*100}%"></div>`;};
window.addEventListener('mouseup',()=>{drag=null});
$('#save').onclick=()=>{if(box)post({kind:'region_POC',page_index0:cur,bbox_norm:box,label:'poc_region'});};
init();
</script></body></html>
